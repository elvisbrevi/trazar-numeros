<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#6cc8ff" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="¡A escribir!" />
    <meta name="description" content="Aprende a escribir números, vocales, sílabas y palabras trazándolas con el dedo." />
    <link rel="icon" href="./icono.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icono-180.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <title>¡A escribir!</title>
  </head>
  <body data-pantalla="inicio">
    <canvas id="lienzo" aria-label="Zona para trazar con el dedo"></canvas>

    <nav id="barra" aria-label="Elige qué escribir"></nav>

    <div id="abajo">
      <button id="modo" type="button" aria-label="Cambiar de juego">
        <svg viewBox="0 0 48 48" aria-hidden="true">
          <rect x="6" y="6" width="15" height="15" rx="4" fill="#fff" />
          <rect x="27" y="6" width="15" height="15" rx="4" fill="#ffd23f" />
          <rect x="6" y="27" width="15" height="15" rx="4" fill="#7ee0ff" />
          <rect x="27" y="27" width="15" height="15" rx="4" fill="#fff" />
        </svg>
      </button>
      <div id="centro">
        <img id="dibujo" alt="" hidden />
        <div class="fila">
          <button id="parlante" type="button" aria-label="Escuchar">
            <svg viewBox="0 0 48 48" aria-hidden="true">
              <path d="M8 18h8l10-8v28l-10-8H8z" fill="#fff" stroke="#fff" stroke-width="3" stroke-linejoin="round" />
              <path class="onda" d="M32 17c3 3 3 11 0 14" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" />
              <path class="onda onda2" d="M37 12c6 6 6 18 0 24" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" />
            </svg>
          </button>
          <div id="palabra" aria-live="polite"></div>
        </div>
      </div>
      <button id="otra-vez" type="button" aria-label="Empezar de nuevo">
        <svg viewBox="0 0 48 48" aria-hidden="true">
          <path d="M36 16a14 14 0 1 0 3 12" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" />
          <path d="M38 6v12H26z" fill="#fff" stroke="#fff" stroke-width="2" stroke-linejoin="round" />
        </svg>
      </button>
    </div>

    <div id="bravo" aria-live="assertive"></div>

    <section id="inicio">
      <div class="burbujas" aria-hidden="true"></div>
      <h1>¡A <br />escribir!</h1>
      <p>Sigue el camino con tu dedito ✏️</p>
      <button id="jugar" type="button">¡A jugar!</button>
    </section>

    <section id="final">
      <div class="trofeo" aria-hidden="true">🏆</div>
      <h2>¡Lo lograste!</h2>
      <p></p>
      <button id="de-nuevo" type="button">Jugar otra vez</button>
      <button id="otro-juego" type="button">Elegir otro juego</button>
    </section>

    <section id="menu" aria-label="Elige un juego">
      <button class="cerrar" type="button" aria-label="Volver al juego">✕</button>
      <h2>¿Qué escribimos?</h2>
      <div class="baldosas"></div>
    </section>

    <section id="silabas" aria-label="Elige sílabas o palabras">
      <button class="volver" type="button" aria-label="Volver">
        <svg viewBox="0 0 48 48" aria-hidden="true"><path d="M29 10 15 24l14 14" fill="none" stroke="currentColor" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" /></svg>
      </button>
      <button class="cerrar" type="button" aria-label="Volver al juego">✕</button>
      <h2>Sílabas</h2>
      <div class="baldosas"></div>
    </section>

    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
